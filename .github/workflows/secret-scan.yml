name: Scan secrets (PR)

# Le contrôle qui tourne ici arrive APRÈS coup : à cet instant la valeur est déjà
# dans l'historique du dépôt, et il faut aller la remplacer partout où elle est
# utilisée. C'est un filet, pas la protection principale. La protection
# principale est le scan local, qui tourne AVANT l'enregistrement :
#   plugin/skills/gas-deploy/scripts/gas_secret_scan.py
#
# Point de vérité unique des motifs : ce même script. La ligne `pattern` ci-dessous
# est produite par `python3 gas_secret_scan.py --emit-grep-pattern`. Pour la
# regénérer après avoir ajouté une règle au scanner, relancer cette commande et
# recoller le résultat. Ne pas éditer la liste à la main.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cherche des secrets en dur
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            files=$(git diff --name-only --diff-filter=ACMR "$base" "$head")
            echo "Périmètre : les fichiers modifiés par la demande."
          else
            files=$(git ls-files)
            echo "Périmètre : tout le dépôt (poussée directe sur la branche principale)."
          fi

          # AUCUNE exclusion. Pas même les fichiers de recette du scanner, pas
          # même les fichiers de workflow.
          #
          # La version précédente excluait `.github/workflows/` (un secret collé
          # dans un workflow passait), et une version intermédiaire de ce
          # contrôle excluait le fichier du scanner lui-même « parce qu'il
          # contient de faux secrets ». Cette seconde exclusion a immédiatement
          # laissé passer une VRAIE valeur, la clé du coffre, utilisée par
          # inadvertance comme cas de test. Une exclusion finit toujours par
          # devenir le trou.
          #
          # La règle à la place : un fichier de recette n'écrit jamais une
          # chaîne de forme secrète en clair, il l'assemble à l'exécution.
          if [ -z "$files" ]; then echo "Aucun fichier à scanner."; exit 0; fi

          # Produit par : python3 gas_secret_scan.py --emit-grep-pattern
          pattern='\bntn_[A-Za-z0-9]{20,}|\bsecret_[A-Za-z0-9]{30,}|\bsk-ant-[A-Za-z0-9_-]{20,}|\bsk-(proj-)?[A-Za-z0-9_-]{20,}|\bxox[abporsu]-[0-9A-Za-z-]{10,}|https://hooks\.slack\.com/services/[A-Za-z0-9/_-]{20,}|\bAIza[0-9A-Za-z_-]{35}|\bGOCSPX-[A-Za-z0-9_-]{20,}|\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}|\bgithub_pat_[A-Za-z0-9_]{50,}|\b(AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b|\bdp\.(pt|st|sa|ct)\.[A-Za-z0-9_-]{20,}|\b(sk|rk)_live_[A-Za-z0-9]{20,}|\bpat[A-Za-z0-9]{14}\.[0-9a-f]{64}\b|\bSG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|\bAC[0-9a-f]{32}\b|\bsk_[0-9a-f]{40,}\b|-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY|\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|https://[0-9a-f]{20,}@[A-Za-z0-9.-]*sentry\.io|\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{32}\b|\bpof-[a-z]{3,20}-20[0-9]{2}\b'

          hits=$(echo "$files" | tr '\n' '\0' | xargs -0 -r grep -nIE "$pattern" || true)
          if [ -n "$hits" ]; then
            # On n'affiche jamais la valeur trouvée : le journal d'un workflow
            # est lisible par toute personne ayant accès au dépôt.
            echo "$hits" | sed -E 's/(.{0,60}).*/\1 […valeur masquée]/'
            echo "::error::Secret en dur détecté. Doctrine POF : aucun secret en dur, tout passe par le coffre (getSecret_). Si la valeur est réelle, elle est désormais compromise : la faire tourner, ne pas se contenter de la retirer du code."
            exit 1
          fi
          echo "Aucun secret détecté sur $(echo "$files" | wc -l | tr -d ' ') fichier(s)."

      - name: Auto-test du scanner local (si présent dans ce dépôt)
        run: |
          f=plugin/skills/gas-deploy/scripts/gas_secret_scan.py
          if [ -f "$f" ]; then
            python3 "$f" --self-test
          else
            echo "Scanner local absent de ce dépôt : rien à tester."
          fi
